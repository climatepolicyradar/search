[project]
name = "search"
version = "0.1.0"
description = "Tests for measuring the relevance of our search results"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.43.77",
  "duckdb>=1.5.5",
  "fastapi[standard]>=0.141.1",
  "posthog>=7.42.0",
  "prefect[slack]>=3.8.3",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.3",
  "pyvespa>=1.2.4",
  "requests>=2.34.2",
  "rich>=15.0.0",
  "typer>=0.27.1",
  "uvicorn>=0.52.4",
  "components>=1.0.5",
  "polyfactory>=3.3.0",
  "opentelemetry-api>=1.44.0,<2.0.0",
  "opentelemetry-distro>=0.59b0",
  "opentelemetry-exporter-otlp>=1.38.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.62b1",
  "opentelemetry-instrumentation-logging>=0.59b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.62b1",
  "opentelemetry-sdk>=1.38.0,<2.0.0",
  "opentelemetry-instrumentation-requests>=0.59b0",
  "opentelemetry-instrumentation-httpx>=0.59b0",
  "pyright>=1.1.411",
  "moto>=5.2.2",
  "wandb>=0.28.2",
  "pandas>=3.0.5",
  "scikit-learn>=1.9.0",
  "cpr-contracts",
]

[dependency-groups]
research = ["snowflake-connector-python>=4.7.2"]
dev = [
  "pulumi-aws>=7.43.0,<8.0.0",
  "pulumi-docker>=5.1.0,<6.0.0",
  "pulumi-docker-build>=0.0.22,<1.0.0",
  "pulumi-pulumiservice>=1.3.0",
  "pulumi>=3.259.0,<4.0.0",
  "pytest>=9.1.1",
  "hypothesis>=6.165.10",
  "boto3-stubs[s3,ssm]>=1.43.77",
]

[tool.uv.sources]
components = { git = "https://github.com/climatepolicyradar/infra", subdirectory = "components", tag = "v1.0.5" }
cpr-contracts = { git = "https://github.com/climatepolicyradar/contracts", tag = "v0.1.3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint."messages control"]
disable = ["logging-fstring-interpolation"] # W1203: allow f-strings in logging

[tool.pylint.'tests/*']
disable = [
  "C0115",
  "C0116", # test function names should be descriptive enough to understand the test's purpose, without always needing a docstring
]

[tool.typos.files]
extend-exclude = ["relevance_tests/*.py"]

[tool.typos.default.extend-words]
tak = "tak" # Polish for 'yes' - a questionnaire answer token in search/passage.py


[tool.pyright]
venvPath = "."
venv = ".venv"
