[project]
name = "search"
version = "0.1.0"
description = "Tests for measuring the relevance of our search results"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.43.118",
  "duckdb>=1.5.6",
  "fastapi[standard]>=0.143.3",
  "posthog>=7.75.11",
  # @related: PREFECT_VERSION
  # This should match the Dockerfiles using prefect as that's what we deploy to prefect
  # which can cause unexpected results.
  "prefect[slack]==3.9.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "python-dotenv>=1.2.4",
  "pyvespa>=1.2.9",
  "requests>=2.34.2",
  "rich>=15.0.0",
  "typer>=0.27.3",
  "uvicorn>=0.54.0",
  "components>=1.0.5",
  "polyfactory>=3.5.0",
  "opentelemetry-api>=1.45.1,<2.0.0",
  "opentelemetry-distro>=0.59b0",
  "opentelemetry-exporter-otlp>=1.45.1,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.62b1",
  "opentelemetry-instrumentation-logging>=0.59b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.62b1",
  "opentelemetry-sdk>=1.38.0,<2.0.0",
  "opentelemetry-instrumentation-requests>=0.59b0",
  "opentelemetry-instrumentation-httpx>=0.59b0",
  "pyright>=1.1.414",
  "moto>=5.2.4",
  "wandb>=0.31.0",
  "pandas>=3.1.0",
  "scikit-learn>=1.9.1",
  "cpr-contracts",
]

[dependency-groups]
research = ["snowflake-connector-python>=4.8.0", "openpyxl>=3.1.5"]
dev = [
  "pulumi-aws>=7.51.1,<8.0.0",
  "pulumi-docker>=5.2.0,<6.0.0",
  "pulumi-docker-build>=0.0.22,<1.0.0",
  "pulumi-pulumiservice>=1.5.0",
  "pulumi>=3.272.0,<4.0.0",
  "pytest>=9.1.1",
  "hypothesis>=6.170.8",
  "boto3-stubs[s3,ssm]>=1.43.118",
  "pulumiverse-grafana>=2.44.0",
]

[tool.uv.sources]
components = { git = "https://github.com/climatepolicyradar/infra", subdirectory = "components", tag = "v1.0.5" }
cpr-contracts = { git = "https://github.com/climatepolicyradar/contracts", tag = "v0.1.3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint."messages control"]
disable = ["logging-fstring-interpolation"] # W1203: allow f-strings in logging

[tool.pylint.'tests/*']
disable = [
  "C0115",
  "C0116", # test function names should be descriptive enough to understand the test's purpose, without always needing a docstring
]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
