name: Vespa Deploy

# Based on @see: https://github.com/vespa-cloud/vector-search/blob/main/.github/workflows/deploy-vector-search.yaml

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  # needed for reading the OIDC token and assuming the role
  id-token: write

jobs:
  vespa_deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VESPA_CLI_API_KEY: ${{ secrets.VESPA_CLI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Vespa CLI
        env:
          VESPA_CLI_VERSION: 8.250.43
        run: |
          mkdir vespa-cli
          curl -fsSL https://github.com/vespa-engine/vespa/releases/download/v${VESPA_CLI_VERSION}/vespa-cli_${VESPA_CLI_VERSION}_linux_amd64.tar.gz | \
            tar -zxf - -C vespa-cli --strip-component=1
          echo "$GITHUB_WORKSPACE/vespa-cli/bin" >> $GITHUB_PATH
      - run: |
          vespa config set target cloud
          vespa config set zone prod.aws-eu-west-1a
          vespa config set application climate-policy-radar.search.search-production
        working-directory: ./vespa
      - run: vespa prod deploy ./app
        working-directory: ./vespa
      # Records the commit last submitted to prod, so `merge_to_main` can tell when
      # main has drifted ahead of what is deployed. @see the `vespa-drift` step there.
      - name: Record deployed commit
        run: |
          git tag --force vespa-prod-deployed "$GITHUB_SHA"
          git push --force origin refs/tags/vespa-prod-deployed
