name: Relevance Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [tv/relevance-tests-gha]

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  relevance_test:
    name: relevance_test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        suite:
          - documents
          - passages
          - labels

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }

      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Run relevance tests
        working-directory: ./relevance_tests
        env:
          DISABLE_WANDB: "1"
        run: uv run python -m test_${{ matrix.suite }}
