name: Pulumi Up

on:
  # checkov:skip=CKV_GHA_7: this is a deploy workflow, not a build; the environment input selects the target stack and does not affect a build artifact
  workflow_dispatch:
    inputs:
      environment:
        description: Pulumi stack environment to deploy
        type: choice
        options:
          - production
          - staging
        default: production
        required: true
      working-directory:
        description: Directory containing the Pulumi project to deploy
        type: string
        default: ./infra
        required: true
      stack:
        description: Pulumi stack to deploy (org/project/stack)
        type: string
        default: climatepolicyradar/search
        required: true
      aws-role:
        description: >-
          Name of the CI role (under the /ci/ path) to assume for this project's
          deploy, e.g. ci-search-production. The role only works in the GitHub
          environment it was written for, so it has to match the environment
          input. Leave empty for a project with no AWS resources (e.g. k6/infra,
          which only touches Grafana Cloud), which skips the AWS credentials
          step entirely.
        type: string
        default: ci-search-production
        required: false
  workflow_call:
    inputs:
      environment:
        description: Pulumi stack environment to deploy
        type: string
        required: true
      working-directory:
        description: Directory containing the Pulumi project to deploy
        type: string
        default: ./infra
        required: false
      stack:
        description: Pulumi stack to deploy (org/project/stack)
        type: string
        default: climatepolicyradar/search
        required: false
      aws-role:
        description: >-
          Name of the CI role (under the /ci/ path) to assume for this project's
          deploy, e.g. ci-search-production. Leave empty for a project with no
          AWS resources, which skips the AWS credentials step.
        type: string
        default: ci-search-production
        required: false

permissions:
  contents: write
  # needed for reading the OIDC token and assuming the role
  id-token: write

jobs:
  pulumi_up:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ci/${{ inputs.aws-role }}
          role-session-name: search-pulumi-up-${{ inputs.environment }}
          aws-region: eu-west-1
          # checkov:skip=CKV_GHA_7: this is a deploy workflow, not a build; the environment input selects the target stack and does not affect a build artifact
          # trunk-ignore(actionlint/action): aws-profile is a valid v6 input; actionlint's popular-actions metadata is stale
          aws-profile: ${{ inputs.environment }}
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - run: just install
      - uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - working-directory: ${{ inputs.working-directory }}
        run: pulumi up --stack ${{ inputs.stack }}/${{ inputs.environment }} --yes --skip-preview
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  notify-failure:
    needs: pulumi_up
    if: failure()
    uses: ./.github/workflows/notify-deploy-failure.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      heading: pulumi up of ${{ inputs.stack }} failed
