name: k6 smoke tests

# Smoke-tests the k6/routes/ suite against production. Deliberately not
# merge-gating: BASE_URL defaults to production (search-api has no staging
# environment, per the Fusion monitoring RFC), so a failure here should be
# investigated after the fact rather than block a merge. Runs on demand
# (workflow_dispatch) and as a reusable workflow (workflow_call) invoked by
# merge_to_main.yml once deploy-api succeeds. Results stream to Grafana Cloud
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resource: [documents]
    env:
      K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
      K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}
      K6_CLOUD_DOCUMENTS_PROJECT_ID: ${{ secrets.K6_CLOUD_DOCUMENTS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.2.0

      - name: Resolve project ID for ${{ matrix.resource }}
        id: project
        run: |
          case "${{ matrix.resource }}" in
            documents) echo "id=$K6_CLOUD_DOCUMENTS_PROJECT_ID" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown resource: ${{ matrix.resource }}" >&2; exit 1 ;;
          esac

      - uses: grafana/run-k6-action@v1
        with:
          path: k6/routes/${{ matrix.resource }}/**/*.ts
          flags: -e PROFILE=smoke
          parallel: true
          fail-fast: false
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}
          K6_CLOUD_PROJECT_ID: ${{ steps.project.outputs.id }}
