# trunk-ignore-all(checkov/CKV2_GHA_1)
name: Deploy search review stacks

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
    branches: [main]

jobs:
  review-stack:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      ORG: climatepolicyradar
      PROJECT: search
    steps:
      - name: Check if deploy:dev label is present
        id: label_check
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          HAS_LABEL="false"
          for label in $(echo "$LABELS_JSON" | jq -r '.[]'); do
            if [ "$label" = "deploy:dev" ]; then
              HAS_LABEL="true"
              break
            fi
          done
          echo "has_label=$HAS_LABEL" >> "$GITHUB_OUTPUT"

      - name: Determine action
        id: decide
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HAS_LABEL: ${{ steps.label_check.outputs.has_label }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          action="none"

          if [ "$EVENT_ACTION" = "closed" ]; then
            action="destroy"
          elif [ "$HAS_LABEL" = "true" ]; then
            if [ "$EVENT_ACTION" = "labeled" ] || \
               [ "$EVENT_ACTION" = "synchronize" ]; then
              action="update"
            fi
          elif [ "$EVENT_ACTION" = "unlabeled" ]; then
            action="destroy"
          fi

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "stack_name=pr-search-api-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create stack (if needed)
        if: steps.decide.outputs.action == 'update'
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}" \
            -d "{\"stackName\": \"${STACK_NAME}\"}")

          if [ "$status" -ne 200 ] && [ "$status" -ne 409 ]; then
            echo "Failed to create stack: HTTP $status"
            exit 1
          fi
          echo "Stack ready (HTTP $status)"

      - name: Configure stack deployment settings
        if: steps.decide.outputs.action == 'update'
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
          GITHUB_INSTALLATION_ID: ${{ secrets.PULUMI_INTEGRATION_ID }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}/${STACK_NAME}/deployments/settings" \
            -d "{
              \"sourceContext\": {
                \"git\": {
                  \"branch\": \"main\",
                  \"repoDir\": \"infra\"
                }
              },
              \"gitHub\": {
                \"repository\": \"climatepolicyradar/search\",
                \"installationId\": \"${GITHUB_INSTALLATION_ID}\"
              },
              \"operationContext\": {
                \"preRunCommands\": [
                  \"pulumi config env add search/review --yes --stack ${ORG}/${PROJECT}/${STACK_NAME} || true\",
                  \"pulumi config cp -d ${ORG}/${PROJECT}/${STACK_NAME} -s ${ORG}/${PROJECT}/review || true\"
                ],
                \"options\": {
                  \"skipIntermediateDeployments\": true
                }
              }
            }"

          echo "Deployment settings configured for ${STACK_NAME}"

      - name: Trigger update deployment
        id: trigger_update
        if: steps.decide.outputs.action == 'update'
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          response=$(curl -fsSL -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}/${STACK_NAME}/deployments" \
            -d "{
              \"operation\": \"update\",
              \"inheritSettings\": true,
              \"sourceContext\": {
                \"git\": {
                  \"branch\": \"refs/heads/${BRANCH}\"
                }
              },
              \"operationContext\": {
                \"environmentVariables\": {
                  \"PR_NUMBER\": \"${PR_NUMBER}\"
                }
              }
            }")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "Deployment triggered: HTTP $status"
          echo "$body" | jq .

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Failed to trigger deployment"
            exit 1
          fi

          deployment_id=$(echo "$body" | jq -r '.id')
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        id: wait_deployment
        if: steps.decide.outputs.action == 'update'
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
          DEPLOYMENT_ID: ${{ steps.trigger_update.outputs.deployment_id }}
        run: |
          # Poll every 15s for up to 10 minutes (40 attempts), mirroring
          # navigator-frontend's deploy-review-stack.yml wait step.
          terminal_status=""
          for _ in $(seq 1 40); do
            sleep 15
            response=$(curl -fsSL \
              -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
              "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}/${STACK_NAME}/deployments/${DEPLOYMENT_ID}") || {
              echo "Poll request failed, will retry"
              continue
            }
            current_status=$(echo "$response" | jq -r '.status') || {
              echo "Could not parse deployment status, will retry"
              continue
            }
            echo "Deployment ${DEPLOYMENT_ID} status: ${current_status}"
            if [ "$current_status" = "succeeded" ] || [ "$current_status" = "failed" ]; then
              terminal_status="$current_status"
              break
            fi
          done

          if [ -z "$terminal_status" ]; then
            echo "Timed out waiting for deployment ${DEPLOYMENT_ID} to finish"
            exit 1
          fi

          echo "status=$terminal_status" >> "$GITHUB_OUTPUT"

          if [ "$terminal_status" != "succeeded" ]; then
            echo "Deployment ${DEPLOYMENT_ID} finished with status: $terminal_status"
            exit 1
          fi

      - name: Install pulumi CLI
        if: steps.wait_deployment.outcome == 'success'
        uses: pulumi/actions@v7

      - name: Fetch review stack URL
        id: fetch_url
        if: steps.wait_deployment.outcome == 'success'
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
        run: |
          review_url=$(pulumi stack output review_service_url --stack "${ORG}/${PROJECT}/${STACK_NAME}")
          if [ -z "$review_url" ]; then
            echo "review_service_url stack output was empty"
            exit 1
          fi
          echo "review_url=$review_url" >> "$GITHUB_OUTPUT"

      - name: Post review stack URL to PR
        if: steps.wait_deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_URL: ${{ steps.fetch_url.outputs.review_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOYMENT_ID: ${{ steps.trigger_update.outputs.deployment_id }}
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
        run: |
          marker="<!-- review-stack-url -->"
          logs_url="https://app.pulumi.com/${ORG}/${PROJECT}/${STACK_NAME}/deployments/${DEPLOYMENT_ID}"
          body="${marker}"$'\n'"Review stack: ${REVIEW_URL}"$'\n\n'"[Deployment logs](${logs_url})"

          existing_comment_id=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate | jq -s "[.[][] | select(.body | startswith(\"${marker}\"))][0].id")

          if [ -n "$existing_comment_id" ] && [ "$existing_comment_id" != "null" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${existing_comment_id}" \
              -f body="$body"
            echo "Updated existing comment ${existing_comment_id}"
          else
            gh api \
              --method POST \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$body"
            echo "Created new comment"
          fi

      - name: Trigger destroy deployment
        if: steps.decide.outputs.action == 'destroy'
        env:
          STACK_NAME: ${{ steps.decide.outputs.stack_name }}
        run: |
          stack_status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
            "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}/${STACK_NAME}")

          if [ "$stack_status" -eq 404 ]; then
            echo "Stack ${STACK_NAME} does not exist, nothing to destroy"
            exit 0
          fi

          response=$(curl -fsSL -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${PULUMI_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.pulumi.com/api/stacks/${ORG}/${PROJECT}/${STACK_NAME}/deployments" \
            -d "{
              \"operation\": \"destroy\",
              \"inheritSettings\": true,
              \"operationContext\": {
                \"options\": {
                  \"deleteAfterDestroy\": true
                }
              }
            }")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "Destroy triggered: HTTP $status"
          echo "$body" | jq .
