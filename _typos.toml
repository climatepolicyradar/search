[default]
# typos has no built-in inline directive; this is the upstream-recommended recipe
# for opting a single line out with a trailing `spellchecker:disable-line` comment.
extend-ignore-re = ["(?Rm)^.*(#|//)\\s*spellchecker:disable-line$"]

[default.extend-words]
tak = "tak" # Polish for 'yes' - a questionnaire answer token in search/passage.py

[default.extend-identifiers]
ANDed = "ANDed" # past tense of the boolean AND, used in filter-building docs/comments
